name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test .\L2Monitor.slnx -c Release --nologo

      - name: Verify formatting
        run: dotnet format .\L2Monitor.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Verify installer lifecycle
        shell: pwsh
        run: .\installer\Verify-L2MonitorInstaller.ps1
